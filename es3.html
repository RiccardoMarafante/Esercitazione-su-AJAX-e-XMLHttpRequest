<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Es.3 - responseText vs responseXML</title>
</head>
<body>
    <h1>Confronto JSON e XML</h1>
    <button onclick="caricaJSON()">Carica JSON</button>
    <button onclick="caricaXML()">Carica XML</button>
    
    <pre id="output"></pre>

    <script>
        function caricaJSON() {
            const xhr = new XMLHttpRequest();
            xhr.onload = function () {
                if (xhr.status === 200) {
                    const dati = JSON.parse(xhr.responseText); // Uso di responseText per JSON
                    let testo = "Dati da JSON:\n";
                    dati.forEach(s => testo += `- ${s.nome}: ${s.voto}\n`);
                    document.getElementById('output').textContent = testo;
                }
            };
            xhr.open('GET', 'studenti.json', true);
            xhr.send();
        }

        function caricaXML() {
            const xhr = new XMLHttpRequest();
            xhr.onload = function () {
                if (xhr.status === 200) {
                    const doc = xhr.responseXML; // Uso di responseXML (Document DOM)[cite: 4]
                    if (!doc) {
                        document.getElementById('output').textContent = "Errore: responseXML è null (MIME type non corretto o XML non valido).";
                        return;
                    }
                    const nomi = doc.querySelectorAll('studente');
                    let testo = "Dati da XML:\n";
                    nomi.forEach(s => {
                        const nome = s.querySelector('nome').textContent;
                        const voto = s.querySelector('voto').textContent;
                        testo += `- ${nome}: ${voto}\n`;
                    });
                    document.getElementById('output').textContent = testo;
                }
            };
            xhr.open('GET', 'studenti.xml', true);
            xhr.send();
        }
    </script>
</body>
</html>
